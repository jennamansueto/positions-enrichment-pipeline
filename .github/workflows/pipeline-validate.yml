name: Pipeline Validate

on:
  push:
    paths:
      - "config/**"
  pull_request:
    paths:
      - "config/**"

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Verify domain MD files parse
        run: python scripts/validate_schema.py
      - name: Verify canonical JSON is valid
        run: |
          python -c "
          import json
          from pathlib import Path
          for f in Path('config/mappings').glob('*.json'):
              data = json.loads(f.read_text())
              assert 'domain' in data, f'{f}: missing domain'
              assert 'fields' in data, f'{f}: missing fields'
              print(f'  {f.name}: {len(data[\"fields\"])} fields OK')
          "
      - name: Cross-check MD ↔ JSON consistency
        run: python -m enterprise_pipeline validate
